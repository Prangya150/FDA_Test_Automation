.company-section {

  display: flex;

.form-rows-container {
  display: flex;
  flex-direction: column;

.form-row {
  display: flex;

.form-row:first-of-type {
  margin-top: 0;

.form-field {
  flex: 1;

}
.form-control{
  display: flex;

display: flex;
padding: 16px;
align-items: center;
align-self: stretch;
}
/* Label styling */
.form-field label {
  color: #000;
  margin-bottom: 6px;
  font-family: 'Manrope', Arial, sans-serif;
  font-weight: 500;
  font-size: 14px;
  letter-spacing: 0.15px;
  line-height: 1.2;
  word-break: break-word;
}

/* Input and Select styling */
input, select {
  padding: 10px 12px;
  font-family: 'Manrope', Arial, sans-serif;
  font-size: 14px;
  font-weight: 400;
  letter-spacing: 0.15px;
  color: #000;
  background: #FAFAFA;
  border: 1px solid #CCC;
  border-radius: 5px;
  outline: none;
  box-sizing: border-box;
  transition: border 0.2s;
}

input:focus, select:focus {
  border-color: #3538f8;
}

/* Static text in fields (e.g., read-only or span) */
.form-static {
  color: #000;
  font-family: 'Manrope', Arial, sans-serif;
  font-size: 14px;
  font-weight: 400;
  letter-spacing: 0.15px;
  word-break: break-word;
  padding: 10px 12px;
  background: #FAFAFA;
  border: 1px solid #CCC;
  border-radius: 5px;
}

/* Button styling */
.submit-btn {
  padding: 10px 24px;
  background: #3538f8;
  color: #fff;
  border: none;
  border-radius: 5px;
  font-weight: bold;
  font-size: 1rem;
  cursor: pointer;
  margin-top: 16px;
  align-self: flex-end;
  transition: background 0.2s;
}
.submit-btn:hover {
  background: #1e20b8;
}

  position: fixed;
  top: 0;

.modal-content {
  background: #fff;
  border-radius: 12px;
  width: 380px;
  max-width: 90%;
  overflow: hidden;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
  animation: slideUp 0.3s ease-out;
}

.modal-header {
  font-size: 20px;
  font-weight: 600;
  padding: 16px;
  text-align: center;
  color: white;
}

.modal-header.success {
  background-color: #28a745;
}

.modal-header.failure {
  background: #dc3545; /* red */
}

.modal-body {
  padding: 20px;
  text-align: center;
  font-size: 16px;
  color: #333;
}

.modal-footer {
  padding: 12px;
  text-align: center;
  border-top: 1px solid #eee;
}

.modal-btn {
  padding: 8px 20px;
  border: none;
  border-radius: 6px;
  background: #3498db;
  color: white;
  font-size: 15px;
  cursor: pointer;
  transition: background 0.2s ease;
}

.modal-btn:hover {
  background: #2980b9;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes slideUp {
  from { transform: translateY(30px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.modal-btn.cancel {
  background-color: transparent;
  border: 1px solid #333;
  color: #333;
}

.tcm-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  z-index: 1050;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  animation: tcm-fade-in 0.18s ease;
}

@keyframes tcm-fade-in {
  from { opacity: 0; }
  to   { opacity: 1; }
}

/* ── Dialog container ───────────────────────────────────── */
.tcm-dialog {
  position: relative;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 24px 80px rgba(0, 0, 0, 0.4);
  width: 100%;
  max-width: 1000px;
  height: 90vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: tcm-slide-up 0.22s ease;
}

@keyframes tcm-slide-up {
  from { transform: translateY(24px); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}

/* ── Floating close button ──────────────────────────────── */
.tcm-close-btn {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 10;
  background: rgba(0, 0, 0, 0.55);
  border: none;
  color: #fff;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.15s;
}

.tcm-close-btn:hover {
  background: rgba(0, 0, 0, 0.8);
}

/* ── PDF iframe ─────────────────────────────────────────── */
.tcm-pdf-frame {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}

/* ── Loading state ──────────────────────────────────────── */
.tcm-loading {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  color: #555;
  font-family: "Manrope", sans-serif;
  font-size: 14px;
}

.tcm-spinner {
  width: 40px;
  height: 40px;
  border: 3px solid #e4e7f0;
  border-top-color: #001689;
  border-radius: 50%;
  animation: tcm-spin 0.75s linear infinite;
}

@keyframes tcm-spin {
  to { transform: rotate(360deg); }
}

/* ── Error state ────────────────────────────────────────── */
.tcm-error {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #d93025;
  font-family: "Manrope", sans-serif;
  font-size: 14px;
  font-weight: 600;
  padding: 40px;
  text-align: center;
}

/* ── Mobile open button ─────────────────────────────────── */
.tcm-mobile-open {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px;
}

.tcm-open-btn {
  display: inline-block;
  padding: 14px 28px;
  background: #001689;
  color: #fff;
  border-radius: 8px;
  font-family: "Manrope", sans-serif;
  font-size: 15px;
  font-weight: 600;
  text-decoration: none;
  text-align: center;
}

/* ── Responsive ─────────────────────────────────────────── */
@media (max-width: 600px) {
  .tcm-overlay {
    padding: 0;
  }

  .tcm-dialog {
    height: 100vh;
    border-radius: 0;
  }
}
