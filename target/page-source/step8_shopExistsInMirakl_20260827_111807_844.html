                                    $('#loginForm').submit(function (evt) {
                                            evt.preventDefault();
                                            evt.stopPropagation();

                                            submitButton.prop('disabled', true);
                                            submitButtonSpinner.show();

                                            $.post("/login/option", {

                                                })

                                                    submitButton.prop('disabled', false);
                                                    submitButtonSpinner.hide();
                                                    $('#login-error').show();
                                                });
                                        }
                                    );

                                    if (usernameInput.val() !== '' && messageBarMessage === undefined) {
