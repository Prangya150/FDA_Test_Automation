    <script type="application/javascript">
        (function checkMFARememberBrowserInput() {
            const rememberMeCheckbox = document.getElementById('rememberBrowser');
            if (rememberMeCheckbox != null) {
                rememberMeCheckbox.checked = true;
            }
        })();

        (function miraklAgentButton() {
            const usernameElement = document.getElementsByName('username');
            const emailElement = document.getElementsByName('email');

            const numberOfSecondaryConnection = document.querySelectorAll('form[data-form-secondary|="true"]').length;

            function displayMiraklAgentButtonIfNeeded() {
                if ((!usernameElement || usernameElement.length === 0) && (!emailElement || emailElement.length === 0)) {
                    
                    return;
                }

                let username = '';
                if (usernameElement && usernameElement.length > 0) {
                    username = usernameElement[0].value;
                } else if (emailElement && emailElement.length > 0) {
                    username = emailElement[0].value;
                }

                
                const shouldDisplayMiraklAgentButton = username.endsWith('@mirakl.com') || localStorage.getItem('mirakl_agent') === 'true';

                if (shouldDisplayMiraklAgentButton) {
                    localStorage.setItem('mirakl_agent', 'true');
                }

                const jumpcloudInput = document.querySelector('input[value|="jumpcloud"]');
                if (!jumpcloudInput) {
                    return;
                }

                const jumpcloudForm = jumpcloudInput.parentElement;
                if (!jumpcloudForm) {
                    return;
                }
                jumpcloudForm.style.display = shouldDisplayMiraklAgentButton ? 'block' : 'none';

                
                if (numberOfSecondaryConnection === 1) {
                    const secondaryConnectionSection = jumpcloudForm.parentElement;
                    if (!secondaryConnectionSection) {
                        return;
                    }

                    secondaryConnectionSection.style.display = shouldDisplayMiraklAgentButton ? 'block' : 'none';

                    
                    const orSeparator = secondaryConnectionSection.previousElementSibling;
                    orSeparator.classList.add('or-separator');

                    if (orSeparator) {
                        orSeparator.style.display = shouldDisplayMiraklAgentButton ? 'flex' : 'none';
                    }
                }
            }

            displayMiraklAgentButtonIfNeeded();
            if (usernameElement != null && usernameElement.length > 0) {
                usernameElement[0].addEventListener('change', displayMiraklAgentButtonIfNeeded);
                usernameElement[0].addEventListener('keyup', displayMiraklAgentButtonIfNeeded);
            }
            if (emailElement != null && emailElement.length > 0) {
                emailElement[0].addEventListener('change', displayMiraklAgentButtonIfNeeded);
                emailElement[0].addEventListener('keyup', displayMiraklAgentButtonIfNeeded);
            }
        })();

        
        (function displayHeaderWithClientInfo() {
            const customHeader = `
                  <div class="client-logo-wrapper">
                      <img alt="" src="https://farmaciasdelahorromx2-dev.mirakl.net/media/operator-interface-logo" />
                  </div>
              `;
            document.querySelector('._widget header').insertAdjacentHTML('afterbegin', customHeader);
        })();
        
    </script>
