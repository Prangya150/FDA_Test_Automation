# Browser: chrome | firefox | edge
browser=chrome

# Target application base URL
base.url=https://the-internet.herokuapp.com

# Explicit wait timeout in seconds
explicit.wait=10

# Run browser in headless mode: true | false
headless=false

# Optional: reuse a Chrome profile directory across runs instead of a fresh one each time.
# Left empty by default (every test gets an isolated profile as before). Set this to make a site's
# "remember this device" cookie survive across executions - e.g. TC_FBS_001 needs it so Mirakl's
# email MFA challenge only has to be completed once, not on every run.
chrome.user.data.dir=

# ============================================================
# TC_FBS_001 - FDA / Mirakl / Kibo FBS order lifecycle
# All secret values below are placeholders. Override them with
# -D system properties (or CI secrets) instead of committing
# real credentials, e.g.:
#   mvn test -Dfda.password=*** -Dmirakl.password=*** -Dkibo.client.secret=***
# ConfigManager already gives -D system properties precedence
# over this file (see ConfigManager#get).
# ============================================================

# --- FDA (Magento storefront) ---
fda.base.url=https://mcstaging.fahorro.com
# CONFIRMED via a real completed order on mcstaging (2026-08-19): the order history status right
# after placing an order reads "Pendiente", not "Creada" as stated in the TC_FBS_001 test case text.
# Left configurable in case "Creada" is correct for a different locale/environment - override with
# -Dfda.order.initial.status=Creada if that turns out to be the intended value.
fda.order.initial.status=Pendiente
fda.username=darshanmk+1@kognivera.com
fda.password=Darshan@2003
fda.product.sku=3333226108
fda.card.number=5454545454545454
fda.card.expiry=03/30
fda.card.cvv=737

# --- Mirakl (operator front office) ---
mirakl.base.url=https://farmaciasdelahorromx2-dev.mirakl.net
mirakl.username=darshanmk@kognivera.com
mirakl.password=Darshan@1234
# Seconds to poll while waiting for the FDA order to sync into Mirakl / for a status transition.
# The search itself was broken (see MiraklOrdersPage - missing "WEB-A" suffix), which masked the
# real sync latency; a 2-minute-old order still doesn't show up even with the corrected search, so
# sync genuinely takes several minutes here, not seconds. Back to a generous window.
# CONFIRMED live on 2026-08-20: even 900s (15 min) is occasionally not enough - one real order
# still hadn't synced after the full 15 minutes - bumped further for headroom against that variance.
mirakl.sync.timeout.seconds=1200
mirakl.sync.poll.interval.seconds=15

# --- Accounting document upload ---
# Absolute path to the invoice file to upload. Machine-specific default supplied by QA;
# override with -Dinvoice.file.path=... on other machines/CI.
invoice.file.path=C:\\Users\\DarshanMK\\Downloads\\delivery-4000251602WEB-A.pdf

# --- Tracking ---
tracking.carrier=DHL

# --- Kibo Commerce API ---
kibo.auth.url=https://t1000490-s1000992.sb.usc1.gcp.kibocommerce.com/api/platform/applications/authtickets/oauth
kibo.orders.url=https://t1000490-s1000992.sb.usc1.gcp.kibocommerce.com/api/commerce/orders/?pageSize=500&pageCount=1&responseFields=items(id,status,externalId)
kibo.shipments.url=https://t1000490-s1000992.sb.usc1.gcp.kibocommerce.com/api/commerce/shipments
kibo.client.id=ajykwpgx.API_Connector.1.0.0.Release
kibo.client.secret=bde687a9ad2a4973aeaec38a2574dd74
# CONFIRMED live on 2026-08-20 against a real shipment response: deliveryType is nested under
# _embedded.shipments[0].items[0].data.deliveryType, not items[0].deliveryType as first guessed.
kibo.shipment.deliveryType.jsonPath=_embedded.shipments[0].items[0].data.deliveryType
kibo.sync.timeout.seconds=120
kibo.sync.poll.interval.seconds=5

